[package]
name = "lora-store"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "In-memory graph store with property indexes for LoraDB."
keywords = ["loradb", "graph", "in-memory", "storage", "database"]
categories = ["database-implementations", "data-structures"]

[features]
# Build a restored graph's indexes on every core. Default-on for native
# builds; wasm consumers opt out with `default-features = false`.
default = ["parallel"]
parallel = ["dep:rayon"]

[dependencies]
lora-ast.workspace = true
serde.workspace = true
crc32fast.workspace = true
smallvec.workspace = true
unicode-normalization.workspace = true
thiserror.workspace = true
jiff.workspace = true
rayon = { workspace = true, optional = true }

# Wall-clock reads go through the standard library on native targets and
# through `js_sys::Date::now()` on wasm32-unknown-unknown, where
# `SystemTime::now()` panics. See `temporal::unix_now`.
[dev-dependencies]
serde_json.workspace = true

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys = "0.3"
