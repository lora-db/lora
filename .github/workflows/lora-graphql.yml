name: lora-graphql

# CI gate for @loradb/lora-graphql, the schema-first GraphQL layer in
# `packages/lora-graphql/`. Its tests run real statements, so they need a
# LoraDB binding.
#
#   workspace: builds @loradb/lora-node from this tree (napi), then runs
#              lint, typecheck, the vitest suite (including the
#              property-based auth tests), the library build and a pack
#              check. This is the blocking gate, and it also catches a
#              stale lora-node dist/ locally-built binaries can hide.
#   published: runs the same tests against the @loradb/lora-node release
#              the peer range names, and skips (with a notice) while that
#              version is not on npm yet, as between a version bump and its
#              release. Non-blocking.

on:
  push:
    branches: [main]
    paths:
      - "packages/lora-graphql/**"
      # test/docs.test.ts runs the website's GraphQL guide.
      - "apps/loradb.com/docs/graphql/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "yarn.lock"
      - ".yarnrc.yml"
      - "rust-toolchain.toml"
      - ".github/actions/setup-rust/**"
      - ".github/actions/setup-node-yarn/**"
      - ".github/workflows/lora-graphql.yml"
  pull_request:
    paths:
      - "packages/lora-graphql/**"
      # test/docs.test.ts runs the website's GraphQL guide.
      - "apps/loradb.com/docs/graphql/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "yarn.lock"
      - ".yarnrc.yml"
      - "rust-toolchain.toml"
      - ".github/actions/setup-rust/**"
      - ".github/actions/setup-node-yarn/**"
      - ".github/workflows/lora-graphql.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workspace:
    name: against the workspace binding
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: lora-graphql-ubuntu

      - uses: ./.github/actions/setup-node-yarn
        with:
          node-version: "20"

      - name: yarn install (monorepo root)
        run: corepack yarn install --immutable

      - name: Build @loradb/lora-node from source (napi + TS)
        working-directory: crates/bindings/lora-node
        run: |
          corepack yarn run build:native
          corepack yarn run build:ts

      - name: ESLint
        run: corepack yarn workspace @loradb/lora-graphql lint

      - name: Typecheck
        run: corepack yarn workspace @loradb/lora-graphql typecheck

      - name: Vitest (graphql 16)
        run: corepack yarn workspace @loradb/lora-graphql test

      - name: Vitest (graphql 17)
        run: corepack yarn workspace @loradb/lora-graphql test:graphql17

      - name: Build library (vite)
        run: corepack yarn workspace @loradb/lora-graphql build

      - uses: ./.github/actions/copy-license
        with:
          destination: packages/lora-graphql

      - name: Inspect publish payload (npm pack --dry-run)
        working-directory: packages/lora-graphql
        run: npm pack --dry-run

      # The project the website tutorial builds: starts its servers and
      # calls them over HTTP and WebSocket with signed tokens. It installs
      # the library from this checkout and the binding from npm, so
      # between a version bump and its release it can be ahead of the
      # published binding: report, do not block.
      - name: Tutorial example (servers, tokens, subscriptions)
        working-directory: packages/lora-graphql/examples/tutorial
        continue-on-error: true
        run: |
          npm install
          npm run typecheck
          npm test

  published:
    name: against the published binding
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-node-yarn
        with:
          node-version: "20"

      - name: yarn install (monorepo root)
        run: corepack yarn install --immutable

      - name: Install the @loradb/lora-node release the peer range names
        id: pinned
        run: |
          range=$(node -p "require('./packages/lora-graphql/package.json').peerDependencies['@loradb/lora-node']")
          echo "peer range: $range"
          # Between a version bump and its release the range names a binding
          # that is not on npm yet: nothing to test against, so skip.
          if [ -z "$(npm view "@loradb/lora-node@$range" version 2>/dev/null)" ]; then
            echo "::notice::@loradb/lora-node@$range is not published yet; skipping the published-binding tests"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/pinned"
          (cd "$RUNNER_TEMP/pinned" && npm init -y >/dev/null && npm install "@loradb/lora-node@$range")
          rm -rf node_modules/@loradb/lora-node
          ln -s "$RUNNER_TEMP/pinned/node_modules/@loradb/lora-node" node_modules/@loradb/lora-node
          node -p "'using @loradb/lora-node ' + require('@loradb/lora-node/package.json').version"

      - name: Vitest
        if: steps.pinned.outputs.available == 'true'
        run: corepack yarn workspace @loradb/lora-graphql test
