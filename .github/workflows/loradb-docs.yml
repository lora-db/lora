name: loradb-docs

# Docusaurus site under `apps/loradb.com` published to Cloudflare Pages at
# https://loradb.com (custom apex domain attached to the `loradb-docs`
# project in the Cloudflare Pages dashboard).
#
# Deploy policy:
#   - Tag push matching `v[0-9]+.[0-9]+.[0-9]+` (incl. pre-releases) → build + deploy.
#   - `release.released`                                              → build + deploy
#     (keeps the docs site in sync with tagged releases after the draft
#     in .github/workflows/release.yml is published).
#   - `workflow_dispatch`                                             → build + deploy
#     (manual rebuild / recovery).
#   - PR                                                              → build only
#     (verify the site still builds; artefact uploaded for inspection, no deploy).
#   - Push to `main` touching the docs paths below                    → build + deploy.
#     Previously main was NOT a trigger and docs only went live on a
#     versioned release. That coupled every content fix to a code release,
#     so doc edits sat unpublished for weeks and search engines saw a
#     static site. Content freshness is a ranking input, so docs now ship
#     on merge.
#
#     `paths` keeps unrelated monorepo commits (Rust crates, bindings)
#     from rebuilding the site. Note that GitHub does NOT evaluate path
#     filters for tag pushes, so the release path above still deploys
#     unconditionally even when a tag touches no file under these paths.
#
# Secrets required for deploy (configure under repo Settings → Secrets):
#   CLOUDFLARE_API_TOKEN  — token scoped to "Pages — Edit"
#   CLOUDFLARE_ACCOUNT_ID — found in the Cloudflare dashboard sidebar
# The deploy job fails fast with a clear message if either is missing.

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
    paths:
      - "apps/loradb.com/**"
      - "packages/lora-query/**"
      - ".github/workflows/loradb-docs.yml"
  pull_request:
    paths:
      - "apps/loradb.com/**"
      - "packages/lora-query/**"
      - ".github/workflows/loradb-docs.yml"
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      indexnow_since:
        description: >-
          IndexNow submission window. "7d" (the automatic default) submits
          only pages whose <lastmod> moved in the last 7 days. Use "all" to
          submit every URL in the sitemap, which is what you want for a
          first-time seed or after a bulk content change.
        required: false
        default: "7d"
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  # Serialise deploys across ref boundaries (main push + release + dispatch
  # + tag push can't race each other) but let PR validation runs cancel
  # stale builds of themselves.
  #
  # Deploys deliberately queue rather than cancel: they all share the one
  # 'deploy' group, so enabling cancel-in-progress here would let a routine
  # docs push abort an in-flight release deploy and leave the older build
  # live. Back-to-back doc commits therefore cost one full build each.
  group: loradb-docs-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/loradb.com
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history, not the default shallow (depth 1) clone.
          # scripts/inject-sitemap-lastmod.mjs (run from the `build` script)
          # derives each URL's <lastmod> from `git log -1` on the page's
          # source file. A depth-1 clone has exactly one commit, so every
          # lookup returns the same timestamp and the whole sitemap ships
          # one identical build-time lastmod — which is what production
          # has been serving (every URL stamped 2026-05-28).
          fetch-depth: 0

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: loradb-docs-ubuntu
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "v0.14.0"

      - uses: ./.github/actions/setup-node-yarn
        with:
          node-version: "20"

      - name: yarn install (immutable)
        working-directory: .
        run: corepack yarn install --immutable

      - name: Build @loradb/lora-query
        run: corepack yarn workspace @loradb/lora-query build

      - name: Build site
        run: corepack yarn run build

      - name: Verify SEO artefacts are in build output
        # robots.txt is copied from static/, sitemap.xml is generated by
        # @docusaurus/plugin-sitemap. Fail the build if either is missing
        # so a silent SEO regression never reaches production.
        run: |
          test -f build/robots.txt
          test -f build/sitemap.xml
          grep -q 'https://loradb.com/sitemap.xml' build/robots.txt
          grep -q 'https://loradb.com/' build/sitemap.xml

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: loradb-docs-build-${{ github.sha }}
          path: apps/loradb.com/build
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: deploy
    # Never deploy from PR runs — they lack Cloudflare secrets and would
    # leak a preview URL outside the controlled production environment.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://loradb.com
    steps:
      - name: Verify Cloudflare secrets are configured
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [[ -z "${CF_API_TOKEN}" ]]; then
            echo "::error::Missing repo secret CLOUDFLARE_API_TOKEN."
            missing=1
          fi
          if [[ -z "${CF_ACCOUNT_ID}" ]]; then
            echo "::error::Missing repo secret CLOUDFLARE_ACCOUNT_ID."
            missing=1
          fi
          if [[ "${missing}" != "0" ]]; then
            exit 1
          fi

      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: loradb-docs-build-${{ github.sha }}
          path: build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=loradb-docs --branch=main

      # apps/loradb.com/scripts/indexnow.mjs has existed (and been exposed
      # as `yarn indexnow`) without ever running in CI, so the ping was only
      # ever sent by hand. The ownership key at static/<KEY>.txt is already
      # deployed, and the script needs no secrets.
      #
      # Sparse checkout because this job otherwise never checks out the
      # repo — it only downloads the build artifact.
      - name: Check out IndexNow script
        uses: actions/checkout@v5
        with:
          sparse-checkout: apps/loradb.com/scripts
          sparse-checkout-cone-mode: false
          path: repo

      # Runs after the upload so the URLs are actually fetchable when Bing
      # and Yandex come to verify them. --since=7d keeps the payload to
      # what changed rather than re-submitting all 96 URLs on every deploy;
      # it depends on real per-page <lastmod>, which only started working
      # once the build job stopped doing a shallow clone.
      #
      # Never fails the deploy: IndexNow is fire-and-forget, and a 4xx from
      # a third-party endpoint is not a reason to red-flag a good release.
      #
      # The window defaults to 7d on automatic runs (push, tag, release);
      # `github.event.inputs.*` is empty outside workflow_dispatch, so the
      # || fallback covers those. Dispatching with indexnow_since=all drops
      # the filter entirely and submits every sitemap URL.
      - name: Ping IndexNow
        continue-on-error: true
        env:
          SINCE: ${{ github.event.inputs.indexnow_since || '7d' }}
        run: |
          args=(--sitemap=build/sitemap.xml)
          if [[ "${SINCE}" != "all" ]]; then
            args+=(--since="${SINCE}")
          fi
          echo "IndexNow window: ${SINCE}"
          node repo/apps/loradb.com/scripts/indexnow.mjs "${args[@]}"
