# =============================================================================
# Comparison workload catalogue
#
# Each entry describes a single benchmark group. The bench harness
# (benches/comparison.rs) loads this file and runs every workload against
# every engine in `src/engine.rs::registry()` that has a query string for
# the workload.
#
# Schema:
#   id           — stable identifier (becomes part of the criterion group)
#   group        — logical bucket; criterion group name is "{group}/{id}"
#   fixture      — empty | nodes | chain | star | social
#   size         — optional size override (defaults via `defaults` block)
#   iter         — read | per_iter_query | per_iter_seed | construct
#   throughput   — none | elements | edges_minus_1 | edges_minus_2 |
#                  edges_minus_3 | single
#   queries      — map of engine_name → query string. `${size}`,
#                  `${half_size}`, `${size_plus_1}` are substituted at
#                  load time.
#
# To add a new database system: implement an engine module under
# `src/engines/`, register it in `registry()`, and add its key (with a
# query) to whichever workloads it supports.
#
# To add a new feature: add a YAML entry — no Rust changes required.
# =============================================================================

defaults:
  size: 1000
  fixture_size:
    chain: 500
    social: 500
  # Group → website category. Lets the website report bucket workloads
  # into a small set of "stories" without renaming every group.
  categories:
    setup: schema
    writes: writes
    scans: filtering
    predicates: filtering
    strings: text
    numerics: numeric
    aggregates: aggregation
    pipeline: pipeline
    lists: query_shaping
    sort: query_shaping
    traversals: graph_traversal
    patterns: graph_traversal

workloads:
  # ---------------------------------------------------------------------
  # setup — DB construction
  # ---------------------------------------------------------------------
  - id: construct_empty
    group: setup
    fixture: empty
    iter: construct
    queries:
      lora: ""
      helixdb: ""
      grafeo: ""
      memgraph: ""
      neo4j: ""
      kuzu: ""

  # ---------------------------------------------------------------------
  # writes
  # ---------------------------------------------------------------------
  - id: write_single
    group: writes
    fixture: empty
    iter: per_iter_query
    queries:
      lora: "CREATE (:N {id: 1, name: 'a', value: 42})"
      helixdb: "write_single"
      grafeo: "INSERT (:N {id: 1, name: 'a', value: 42})"
      surrealdb: "CREATE n:1 SET id = 1, name = 'a', value = 42 RETURN NONE;"
      # Memgraph and Neo4j speak Cypher `CREATE`, not Grafeo's `INSERT`, so
      # they need explicit queries rather than the grafeo alias fallback.
      memgraph: "CREATE (:N {id: 1, name: 'a', value: 42})"
      neo4j: "CREATE (:N {id: 1, name: 'a', value: 42})"
    notes:
      kuzu: "Omitted: Kuzu requires `CREATE NODE TABLE` before inserts; the empty fixture has no schema and adding one would change the iteration's measured cost."

  - id: write_bulk
    group: writes
    fixture: nodes
    iter: per_iter_seed
    throughput: elements
    queries:
      lora: ""
      helixdb: ""
      grafeo: ""
      memgraph: ""
      neo4j: ""
      kuzu: ""
      surrealdb: ""

  - id: update_set
    group: writes
    fixture: nodes
    queries:
      lora: "MATCH (n:Node {id: ${half_size}}) SET n.touched = true"
      helixdb: "update_set:${half_size}"
      grafeo: "MATCH (n:Node {id: ${half_size}}) SET n.touched = true"
      memgraph: "MATCH (n:Node {id: ${half_size}}) SET n.touched = true"
      neo4j: "MATCH (n:Node {id: ${half_size}}) SET n.touched = true"
      kuzu: "MATCH (n:Node {id: ${half_size}}) SET n.touched = true"
      surrealdb: "UPDATE node SET touched = true WHERE id = ${half_size};"

  - id: set_multiple_props
    group: writes
    fixture: nodes
    queries:
      lora: "MATCH (n:Node {id: ${half_size}}) SET n.a = 1, n.b = 2"
      helixdb: "set_multiple_props:${half_size}"
      grafeo: "MATCH (n:Node {id: ${half_size}}) SET n.a = 1, n.b = 2"
      memgraph: "MATCH (n:Node {id: ${half_size}}) SET n.a = 1, n.b = 2"
      neo4j: "MATCH (n:Node {id: ${half_size}}) SET n.a = 1, n.b = 2"
      kuzu: "MATCH (n:Node {id: ${half_size}}) SET n.a = 1, n.b = 2"
      surrealdb: "UPDATE node SET a = 1, b = 2 WHERE id = ${half_size};"

  - id: bulk_set_match
    group: writes
    fixture: nodes
    queries:
      lora: "MATCH (n:Node) WHERE n.value > 50 SET n.flagged = true"
      helixdb: "bulk_set_match"
      grafeo: "MATCH (n:Node) WHERE n.value > 50 SET n.flagged = true"
      memgraph: "MATCH (n:Node) WHERE n.value > 50 SET n.flagged = true"
      neo4j: "MATCH (n:Node) WHERE n.value > 50 SET n.flagged = true"
      kuzu: "MATCH (n:Node) WHERE n.value > 50 SET n.flagged = true"
      surrealdb: "UPDATE node SET flagged = true WHERE value > 50;"

  - id: delete_node
    group: writes
    fixture: nodes
    iter: per_iter_query
    queries:
      lora: "MATCH (n:Node {id: ${half_size}}) DELETE n"
      helixdb: "delete_node:${half_size}"
      grafeo: "MATCH (n:Node {id: ${half_size}}) DELETE n"
      memgraph: "MATCH (n:Node {id: ${half_size}}) DELETE n"
      neo4j: "MATCH (n:Node {id: ${half_size}}) DELETE n"
      kuzu: "MATCH (n:Node {id: ${half_size}}) DELETE n"
      surrealdb: "DELETE node WHERE id = ${half_size};"

  - id: merge_existing
    group: writes
    fixture: nodes
    indexes:
      grafeo: [id]
      memgraph: [id]
      neo4j: [id]
    queries:
      lora: "MERGE (n:Node {id: ${half_size}})"
      grafeo: "MERGE (n:Node {id: ${half_size}})"
      memgraph: "MERGE (n:Node {id: ${half_size}})"
      neo4j: "MERGE (n:Node {id: ${half_size}})"
      kuzu: "MERGE (n:Node {id: ${half_size}})"
    notes:
      helixdb: "Omitted: HelixDB has no MERGE/upsert; emulating it needs conditional var_as_if branching."
      surrealdb: "Omitted: SurrealDB's UPSERT semantics diverge from Cypher MERGE on which fields are matched vs set."

  - id: merge_create
    group: writes
    fixture: nodes
    iter: per_iter_query
    indexes:
      grafeo: [id]
      memgraph: [id]
      neo4j: [id]
    queries:
      lora: "MERGE (n:Node {id: ${size_plus_1}})"
      grafeo: "MERGE (n:Node {id: ${size_plus_1}})"
      memgraph: "MERGE (n:Node {id: ${size_plus_1}})"
      neo4j: "MERGE (n:Node {id: ${size_plus_1}})"
      kuzu: "MERGE (n:Node {id: ${size_plus_1}})"
    notes:
      helixdb: "Omitted: HelixDB has no MERGE/upsert (see merge_existing)."
      surrealdb: "Omitted: see merge_existing — UPSERT semantics differ."

  - id: bulk_edges
    group: writes
    fixture: nodes
    size: 200
    iter: per_iter_query
    throughput: elements
    indexes:
      grafeo: [id]
      memgraph: [id]
      neo4j: [id]
    queries:
      lora: "UNWIND range(0, ${size_minus_1}) AS i MATCH (a:Node {id: i}), (b:Node {id: (i + 1) % ${size}}) CREATE (a)-[:LINKS]->(b)"
      helixdb: "bulk_edges:${size}"
      grafeo: "UNWIND range(0, ${size_minus_1}) AS i MATCH (a:Node {id: i}), (b:Node {id: (i + 1) % ${size}}) CREATE (a)-[:LINKS]->(b)"
      memgraph: "UNWIND range(0, ${size_minus_1}) AS i MATCH (a:Node {id: i}), (b:Node {id: (i + 1) % ${size}}) CREATE (a)-[:LINKS]->(b)"
      neo4j: "UNWIND range(0, ${size_minus_1}) AS i MATCH (a:Node {id: i}), (b:Node {id: (i + 1) % ${size}}) CREATE (a)-[:LINKS]->(b)"
      kuzu: "UNWIND range(0, ${size_minus_1}) AS i MATCH (a:Node {id: i}), (b:Node {id: (i + 1) % ${size}}) CREATE (a)-[:LINKS]->(b)"
    notes:
      surrealdb: "Omitted: UNWIND-driven bulk RELATE requires scripted FOR loops; not a like-for-like comparison."

  # ---------------------------------------------------------------------
  # scans & lookups
  # ---------------------------------------------------------------------
  - id: scan_label
    group: scans
    fixture: nodes
    throughput: elements
    queries:
      lora: "MATCH (n:Node) RETURN n.id"
      grafeo: "MATCH (n:Node) RETURN n.id"
      memgraph: "MATCH (n:Node) RETURN n.id"
      neo4j: "MATCH (n:Node) RETURN n.id"
      kuzu: "MATCH (n:Node) RETURN n.id"
      surrealdb: "SELECT id FROM node;"
      helixdb: "scan_label"

  - id: scan_filtered
    group: scans
    fixture: nodes
    throughput: elements
    queries:
      lora: "MATCH (n:Node) WHERE n.value > 50 RETURN n.id"
      grafeo: "MATCH (n:Node) WHERE n.value > 50 RETURN n.id"
      memgraph: "MATCH (n:Node) WHERE n.value > 50 RETURN n.id"
      neo4j: "MATCH (n:Node) WHERE n.value > 50 RETURN n.id"
      kuzu: "MATCH (n:Node) WHERE n.value > 50 RETURN n.id"
      surrealdb: "SELECT id FROM node WHERE value > 50;"
      helixdb: "scan_filtered"

  - id: lookup_by_id
    group: scans
    fixture: nodes
    queries:
      lora: "MATCH (n:Node {id: ${half_size}}) RETURN n.name"
      grafeo: "MATCH (n:Node {id: ${half_size}}) RETURN n.name"
      memgraph: "MATCH (n:Node {id: ${half_size}}) RETURN n.name"
      neo4j: "MATCH (n:Node {id: ${half_size}}) RETURN n.name"
      kuzu: "MATCH (n:Node {id: ${half_size}}) RETURN n.name"
      surrealdb: "SELECT name FROM node WHERE id = ${half_size};"
      helixdb: "lookup_by_id:${half_size}"

  - id: lookup_by_id_indexed
    group: scans
    fixture: nodes
    indexes:
      grafeo: [id]
      memgraph: [id]
      neo4j: [id]
      surrealdb: [id]
    queries:
      lora: "MATCH (n:Node {id: ${half_size}}) RETURN n.name"
      grafeo: "MATCH (n:Node {id: ${half_size}}) RETURN n.name"
      memgraph: "MATCH (n:Node {id: ${half_size}}) RETURN n.name"
      neo4j: "MATCH (n:Node {id: ${half_size}}) RETURN n.name"
      kuzu: "MATCH (n:Node {id: ${half_size}}) RETURN n.name"
      surrealdb: "SELECT name FROM node WHERE id = ${half_size};"
      helixdb: "lookup_by_id:${half_size}"

  - id: range_filter
    group: scans
    fixture: nodes
    throughput: elements
    queries:
      lora: "MATCH (n:Node) WHERE n.value >= 25 AND n.value <= 75 RETURN n.id"
      grafeo: "MATCH (n:Node) WHERE n.value >= 25 AND n.value <= 75 RETURN n.id"
      memgraph: "MATCH (n:Node) WHERE n.value >= 25 AND n.value <= 75 RETURN n.id"
      neo4j: "MATCH (n:Node) WHERE n.value >= 25 AND n.value <= 75 RETURN n.id"
      kuzu: "MATCH (n:Node) WHERE n.value >= 25 AND n.value <= 75 RETURN n.id"
      surrealdb: "SELECT id FROM node WHERE value >= 25 AND value <= 75;"

  - id: distinct
    group: scans
    fixture: nodes
    throughput: elements
    queries:
      lora: "MATCH (n:Node) RETURN DISTINCT n.value"
      grafeo: "MATCH (n:Node) RETURN DISTINCT n.value"
      memgraph: "MATCH (n:Node) RETURN DISTINCT n.value"
      neo4j: "MATCH (n:Node) RETURN DISTINCT n.value"
      kuzu: "MATCH (n:Node) RETURN DISTINCT n.value"
    notes:
      helixdb: "Omitted: HelixDB's dedup is node-level; there is no SELECT DISTINCT <property>."
      surrealdb: "Omitted: `value` is a reserved word in SurrealQL's SELECT VALUE clause; no clean equivalent."

  # ---------------------------------------------------------------------
  # predicates
  # ---------------------------------------------------------------------
  - id: where_or
    group: predicates
    fixture: nodes
    queries:
      lora: "MATCH (n:Node) WHERE n.value = 10 OR n.value = 20 RETURN n.id"
      helixdb: "where_or"
      grafeo: "MATCH (n:Node) WHERE n.value = 10 OR n.value = 20 RETURN n.id"
      memgraph: "MATCH (n:Node) WHERE n.value = 10 OR n.value = 20 RETURN n.id"
      neo4j: "MATCH (n:Node) WHERE n.value = 10 OR n.value = 20 RETURN n.id"
      kuzu: "MATCH (n:Node) WHERE n.value = 10 OR n.value = 20 RETURN n.id"
      surrealdb: "SELECT id FROM node WHERE value = 10 OR value = 20;"

  - id: where_in_list
    group: predicates
    fixture: nodes
    queries:
      lora: "MATCH (n:Node) WHERE n.value IN [10, 20, 30] RETURN n.id"
      helixdb: "where_in_list"
      grafeo: "MATCH (n:Node) WHERE n.value IN [10, 20, 30] RETURN n.id"
      memgraph: "MATCH (n:Node) WHERE n.value IN [10, 20, 30] RETURN n.id"
      neo4j: "MATCH (n:Node) WHERE n.value IN [10, 20, 30] RETURN n.id"
      kuzu: "MATCH (n:Node) WHERE n.value IN [10, 20, 30] RETURN n.id"
      surrealdb: "SELECT id FROM node WHERE value IN [10, 20, 30];"

  - id: where_not
    group: predicates
    fixture: nodes
    queries:
      lora: "MATCH (n:Node) WHERE NOT n.value > 50 RETURN n.id"
      helixdb: "where_not"
      grafeo: "MATCH (n:Node) WHERE NOT n.value > 50 RETURN n.id"
      memgraph: "MATCH (n:Node) WHERE NOT n.value > 50 RETURN n.id"
      neo4j: "MATCH (n:Node) WHERE NOT n.value > 50 RETURN n.id"
      kuzu: "MATCH (n:Node) WHERE NOT n.value > 50 RETURN n.id"
      surrealdb: "SELECT id FROM node WHERE !(value > 50);"

  - id: where_compound_and_or
    group: predicates
    fixture: nodes
    queries:
      lora: "MATCH (n:Node) WHERE n.value > 25 AND (n.value < 50 OR n.id < 100) RETURN n.id"
      helixdb: "where_compound_and_or"
      grafeo: "MATCH (n:Node) WHERE n.value > 25 AND (n.value < 50 OR n.id < 100) RETURN n.id"
      memgraph: "MATCH (n:Node) WHERE n.value > 25 AND (n.value < 50 OR n.id < 100) RETURN n.id"
      neo4j: "MATCH (n:Node) WHERE n.value > 25 AND (n.value < 50 OR n.id < 100) RETURN n.id"
      kuzu: "MATCH (n:Node) WHERE n.value > 25 AND (n.value < 50 OR n.id < 100) RETURN n.id"
      surrealdb: "SELECT id FROM node WHERE value > 25 AND (value < 50 OR id < 100);"

  - id: where_starts_with
    group: predicates
    fixture: nodes
    queries:
      lora: "MATCH (n:Node) WHERE n.name STARTS WITH 'node_5' RETURN n.id"
      helixdb: "where_starts_with"
      grafeo: "MATCH (n:Node) WHERE n.name STARTS WITH 'node_5' RETURN n.id"
      memgraph: "MATCH (n:Node) WHERE n.name STARTS WITH 'node_5' RETURN n.id"
      neo4j: "MATCH (n:Node) WHERE n.name STARTS WITH 'node_5' RETURN n.id"
      kuzu: "MATCH (n:Node) WHERE n.name STARTS WITH 'node_5' RETURN n.id"
      surrealdb: "SELECT id FROM node WHERE string::starts_with(name, 'node_5');"

  - id: where_ends_with
    group: predicates
    fixture: nodes
    queries:
      lora: "MATCH (n:Node) WHERE n.name ENDS WITH '0' RETURN n.id"
      helixdb: "where_ends_with"
      grafeo: "MATCH (n:Node) WHERE n.name ENDS WITH '0' RETURN n.id"
      memgraph: "MATCH (n:Node) WHERE n.name ENDS WITH '0' RETURN n.id"
      neo4j: "MATCH (n:Node) WHERE n.name ENDS WITH '0' RETURN n.id"
      kuzu: "MATCH (n:Node) WHERE n.name ENDS WITH '0' RETURN n.id"
      surrealdb: "SELECT id FROM node WHERE string::ends_with(name, '0');"

  - id: where_contains
    group: predicates
    fixture: nodes
    queries:
      lora: "MATCH (n:Node) WHERE n.name CONTAINS '99' RETURN n.id"
      helixdb: "where_contains"
      grafeo: "MATCH (n:Node) WHERE n.name CONTAINS '99' RETURN n.id"
      memgraph: "MATCH (n:Node) WHERE n.name CONTAINS '99' RETURN n.id"
      neo4j: "MATCH (n:Node) WHERE n.name CONTAINS '99' RETURN n.id"
      kuzu: "MATCH (n:Node) WHERE n.name CONTAINS '99' RETURN n.id"
      surrealdb: "SELECT id FROM node WHERE string::contains(name, '99');"

  - id: where_modulo_eq
    group: predicates
    fixture: nodes
    queries:
      lora: "MATCH (n:Node) WHERE n.id % 7 = 0 RETURN n.id"
      helixdb: "where_modulo_eq"
      grafeo: "MATCH (n:Node) WHERE n.id % 7 = 0 RETURN n.id"
      memgraph: "MATCH (n:Node) WHERE n.id % 7 = 0 RETURN n.id"
      neo4j: "MATCH (n:Node) WHERE n.id % 7 = 0 RETURN n.id"
      kuzu: "MATCH (n:Node) WHERE n.id % 7 = 0 RETURN n.id"
      surrealdb: "SELECT id FROM node WHERE id % 7 = 0;"

  - id: where_string_gte
    group: predicates
    fixture: nodes
    queries:
      lora: "MATCH (n:Node) WHERE n.name >= 'node_500' RETURN n.id"
      helixdb: "where_string_gte"
      grafeo: "MATCH (n:Node) WHERE n.name >= 'node_500' RETURN n.id"
      memgraph: "MATCH (n:Node) WHERE n.name >= 'node_500' RETURN n.id"
      neo4j: "MATCH (n:Node) WHERE n.name >= 'node_500' RETURN n.id"
      kuzu: "MATCH (n:Node) WHERE n.name >= 'node_500' RETURN n.id"
      surrealdb: "SELECT id FROM node WHERE name >= 'node_500';"

  - id: where_two_props
    group: predicates
    fixture: nodes
    queries:
      lora: "MATCH (n:Node) WHERE n.value > 50 AND n.id < 100 RETURN n.id"
      helixdb: "where_two_props"
      grafeo: "MATCH (n:Node) WHERE n.value > 50 AND n.id < 100 RETURN n.id"
      memgraph: "MATCH (n:Node) WHERE n.value > 50 AND n.id < 100 RETURN n.id"
      neo4j: "MATCH (n:Node) WHERE n.value > 50 AND n.id < 100 RETURN n.id"
      kuzu: "MATCH (n:Node) WHERE n.value > 50 AND n.id < 100 RETURN n.id"
      surrealdb: "SELECT id FROM node WHERE value > 50 AND id < 100;"

  - id: where_id_in_range
    group: predicates
    fixture: nodes
    queries:
      lora: "MATCH (n:Node) WHERE n.id >= 100 AND n.id <= 200 RETURN n.id"
      helixdb: "where_id_in_range"
      grafeo: "MATCH (n:Node) WHERE n.id >= 100 AND n.id <= 200 RETURN n.id"
      memgraph: "MATCH (n:Node) WHERE n.id >= 100 AND n.id <= 200 RETURN n.id"
      neo4j: "MATCH (n:Node) WHERE n.id >= 100 AND n.id <= 200 RETURN n.id"
      kuzu: "MATCH (n:Node) WHERE n.id >= 100 AND n.id <= 200 RETURN n.id"
      surrealdb: "SELECT id FROM node WHERE id >= 100 AND id <= 200;"

  - id: where_subexpr
    group: predicates
    fixture: nodes
    queries:
      lora: "MATCH (n:Node) WHERE (n.value + n.id) % 2 = 0 RETURN n.id"
      helixdb: "where_subexpr"
      grafeo: "MATCH (n:Node) WHERE (n.value + n.id) % 2 = 0 RETURN n.id"
      memgraph: "MATCH (n:Node) WHERE (n.value + n.id) % 2 = 0 RETURN n.id"
      neo4j: "MATCH (n:Node) WHERE (n.value + n.id) % 2 = 0 RETURN n.id"
      kuzu: "MATCH (n:Node) WHERE (n.value + n.id) % 2 = 0 RETURN n.id"
      surrealdb: "SELECT id FROM node WHERE (value + id) % 2 = 0;"

  # ---------------------------------------------------------------------
  # string functions
  # ---------------------------------------------------------------------
  - id: string_to_upper
    group: strings
    fixture: nodes
    queries:
      lora: "MATCH (n:Node) RETURN toUpper(n.name)"
      grafeo: "MATCH (n:Node) RETURN toUpper(n.name)"
      memgraph: "MATCH (n:Node) RETURN toUpper(n.name)"
      neo4j: "MATCH (n:Node) RETURN toUpper(n.name)"
      kuzu: "MATCH (n:Node) RETURN toUpper(n.name)"
      surrealdb: "SELECT string::uppercase(name) AS upper FROM node;"
    notes:
      helixdb: "Omitted: HelixDB's DSL has no scalar string functions (upper/lower/substring/length/concat) — only property filters and graph traversal."

  - id: string_to_lower
    group: strings
    fixture: nodes
    queries:
      lora: "MATCH (n:Node) RETURN toLower(n.name)"
      grafeo: "MATCH (n:Node) RETURN toLower(n.name)"
      memgraph: "MATCH (n:Node) RETURN toLower(n.name)"
      neo4j: "MATCH (n:Node) RETURN toLower(n.name)"
      kuzu: "MATCH (n:Node) RETURN toLower(n.name)"
      surrealdb: "SELECT string::lowercase(name) AS lower FROM node;"
    notes:
      helixdb: "Omitted: no scalar string functions in the DSL (see string_to_upper)."

  - id: string_substring
    group: strings
    fixture: nodes
    queries:
      lora: "MATCH (n:Node) RETURN substring(n.name, 0, 4)"
      grafeo: "MATCH (n:Node) RETURN substring(n.name, 0, 4)"
      memgraph: "MATCH (n:Node) RETURN substring(n.name, 0, 4)"
      neo4j: "MATCH (n:Node) RETURN substring(n.name, 0, 4)"
      kuzu: "MATCH (n:Node) RETURN substring(n.name, 0, 4)"
      surrealdb: "SELECT string::slice(name, 0, 4) AS sub FROM node;"
    notes:
      helixdb: "Omitted: no scalar string functions in the DSL (see string_to_upper)."

  - id: string_size
    group: strings
    fixture: nodes
    queries:
      lora: "MATCH (n:Node) RETURN size(n.name)"
      grafeo: "MATCH (n:Node) RETURN size(n.name)"
      memgraph: "MATCH (n:Node) RETURN size(n.name)"
      neo4j: "MATCH (n:Node) RETURN size(n.name)"
      kuzu: "MATCH (n:Node) RETURN size(n.name)"
      surrealdb: "SELECT string::len(name) AS len FROM node;"
    notes:
      helixdb: "Omitted: no scalar string functions in the DSL (see string_to_upper)."

  - id: string_concat
    group: strings
    fixture: nodes
    queries:
      lora: "MATCH (n:Node) RETURN n.name + '_x'"
      grafeo: "MATCH (n:Node) RETURN n.name + '_x'"
      memgraph: "MATCH (n:Node) RETURN n.name + '_x'"
      neo4j: "MATCH (n:Node) RETURN n.name + '_x'"
      kuzu: "MATCH (n:Node) RETURN n.name + '_x'"
      surrealdb: "SELECT string::concat(name, '_x') AS joined FROM node;"

  # ---------------------------------------------------------------------
  # numeric functions
  # ---------------------------------------------------------------------
    notes:
      helixdb: "Omitted: no scalar string functions in the DSL (see string_to_upper)."
  - id: numeric_abs
    group: numerics
    fixture: nodes
    queries:
      lora: "MATCH (n:Node) RETURN math.abs(n.value - 50)"
      grafeo: "MATCH (n:Node) RETURN abs(n.value - 50)"
      memgraph: "MATCH (n:Node) RETURN abs(n.value - 50)"
      neo4j: "MATCH (n:Node) RETURN abs(n.value - 50)"
      kuzu: "MATCH (n:Node) RETURN abs(n.value - 50)"
      surrealdb: "SELECT math::abs(value - 50) AS r FROM node;"
    notes:
      helixdb: "Omitted: HelixDB's Expr supports +,-,*,/,% but no abs/floor/ceil/round."

  - id: numeric_modulo
    group: numerics
    fixture: nodes
    queries:
      lora: "MATCH (n:Node) RETURN n.value % 13"
      helixdb: "numeric_modulo"
      grafeo: "MATCH (n:Node) RETURN n.value % 13"
      memgraph: "MATCH (n:Node) RETURN n.value % 13"
      neo4j: "MATCH (n:Node) RETURN n.value % 13"
